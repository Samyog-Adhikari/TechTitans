name: Build KabadMandu Android APK

on:
  push:
    branches:
      - MobileApp
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # -----------------------------
      # 2. Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: KabadMandu/package-lock.json

      # -----------------------------
      # 3. Install React dependencies
      # -----------------------------
      - name: Install dependencies
        working-directory: KabadMandu
        run: npm ci

      # -----------------------------
      # 4. Build React/Vite app
      # -----------------------------
      - name: Build React app
        working-directory: KabadMandu
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # -----------------------------
      # 5. Generate Android app icons from resources/icon.png
      # -----------------------------
      - name: Generate app icons
        working-directory: KabadMandu
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      # -----------------------------
      # 6. Setup Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -----------------------------
      # 7. Sync Capacitor
      # -----------------------------
      - name: Sync Capacitor
        working-directory: KabadMandu
        run: npx cap sync android

      # -----------------------------
      # 8. Make Gradle executable
      # -----------------------------
      - name: Fix Gradle permissions
        working-directory: KabadMandu/android
        run: chmod +x gradlew

      # -----------------------------
      # 9. Build APK
      # -----------------------------
      - name: Build Debug APK
        working-directory: KabadMandu/android
        run: ./gradlew assembleDebug

      # -----------------------------
      # 10. Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: KabadMandu-APK
          path: KabadMandu/android/app/build/outputs/apk/debug/app-debug.apk