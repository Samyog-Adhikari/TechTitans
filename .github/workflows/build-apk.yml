name: Build Android APK

on:
  push:
    branches:
      - MobileApp
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: KabadMandu/package-lock.json

      - name: Install dependencies
        working-directory: KabadMandu
        run: npm ci

      - name: Build React app
        working-directory: KabadMandu
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Sync Capacitor
        working-directory: KabadMandu
        run: npx cap sync android

      - name: Build APK
        working-directory: KabadMandu/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KabadMandu-APK
          path: KabadMandu/android/app/build/outputs/apk/debug/app-debug.apk